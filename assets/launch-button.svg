<svg xmlns="http://www.w3.org/2000/svg" width="520" height="112" viewBox="0 0 520 112" role="img" aria-labelledby="title desc">
<title id="title">Launch Gravity Gone</title>
<desc id="desc">An animated neon launch button with a floating astronaut and orbiting stars. Open the Gravity Gone gravity puzzle game.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172451"/><stop offset="1" stop-color="#090e21"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#5ff0e0"/><stop offset=".5" stop-color="#a5fff4"/><stop offset="1" stop-color="#5ff0e0"/></linearGradient>
  <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .halo{animation:pulse 2.6s ease-in-out infinite;transform-origin:260px 56px}
  .astronaut{transform-origin:65px 54px;animation:float 3.4s ease-in-out infinite}
  .star{animation:blink 2s ease-in-out infinite}
  .s2{animation-delay:-.7s}.s3{animation-delay:-1.3s}
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.025)}}
  @keyframes float{0%,100%{transform:translateY(1px) rotate(-5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.halo,.astronaut,.star{animation:none}}
</style>
<g class="halo" filter="url(#glow)"><rect x="7" y="7" width="506" height="98" rx="25" fill="none" stroke="#5ff0e0" stroke-opacity=".42" stroke-width="2"/></g>
<rect x="10" y="10" width="500" height="92" rx="23" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
<path d="M124 14H462" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
<g class="astronaut" transform="translate(63 50)" stroke-linejoin="round" stroke-linecap="round">
  <path d="M-13 12l-11 13 7 5 14-9M14 12l12 9 3 12-7 2-12-13" fill="#a8b7ff" stroke="#5f75c9" stroke-width="2"/>
  <path d="M-11 20l-6 13 9 4 10-13M7 23l9 10-7 6-9-12" fill="#eef3ff" stroke="#5f75c9" stroke-width="2"/>
  <path d="M-12-10c0-15 7-22 15-22S17-25 17-10v24c0 10-6 17-14 17S-12 24-12 14Z" fill="#f2f5ff" stroke="#7085de" stroke-width="2"/>
  <path d="M-11-10c2-11 7-15 14-15s12 4 14 15v7H-11Z" fill="#26345f" stroke="#5ff0e0" stroke-width="2"/>
  <path d="M-7-3l7-2m4 0 7 2" stroke="#5ff0e0" stroke-width="2.5"/>
  <path d="M-7 11h15v8H-7Z" fill="#172451" stroke="#7085de" stroke-width="1.5"/>
  <circle cy="15" r="2.3" fill="#5ff0e0" stroke="none"/>
  <path d="M-15 33l-4 7m23-7 4 7" stroke="#ffcf5c" stroke-width="2.5"/>
</g>
<g fill="#ffcf5c"><path class="star" d="M104 30v8m-4-4h8"/><circle class="star s2" cx="99" cy="75" r="2"/><path class="star s3" d="M128 72v6m-3-3h6"/></g>
<path d="M145 56H162" stroke="#5ff0e0" stroke-opacity=".45" stroke-width="1.5"/>
<text x="178" y="48" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="900" letter-spacing=".7" fill="#f2f5ff">LAUNCH GRAVITY GONE</text>
<text x="180" y="73" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#5ff0e0">PLAY IN YOUR BROWSER</text>
<g transform="translate(467 57)" fill="none" stroke="#ffcf5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 0h17M2-7l7 7-7 7"/></g>
</svg>