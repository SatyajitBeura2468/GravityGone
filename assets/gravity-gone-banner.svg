<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Gravity Gone — Beura Labs</title>
<desc id="desc">A playful astronaut floats above a glowing gravity puzzle world in a deep indigo starfield.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070914"/><stop offset=".55" stop-color="#111a45"/><stop offset="1" stop-color="#160f36"/></linearGradient>
  <linearGradient id="headline" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#a8b8ff"/></linearGradient>
  <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8178ff"/><stop offset="1" stop-color="#29225d"/></linearGradient>
  <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#a8b7ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#5ff0e0" stop-opacity=".28"/><stop offset="1" stop-color="#5ff0e0" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<style>
  .star{fill:#dfe7ff;opacity:.68}
  .float{transform-origin:820px 250px;animation:float 5.5s ease-in-out infinite}
  .orbit{transform-origin:850px 300px;animation:orbit 12s linear infinite}
  .twinkle{animation:twinkle 2.8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(3px) rotate(-4deg)}50%{transform:translateY(-15px) rotate(3deg)}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.float,.orbit,.twinkle{animation:none}}
</style>
<rect width="1200" height="540" rx="32" fill="url(#bg)"/>
<circle cx="850" cy="280" r="250" fill="url(#glow)"/>
<g class="star"><circle cx="690" cy="67" r="2"/><circle cx="1110" cy="82" r="2.2"/><circle cx="1050" cy="440" r="1.8"/><circle cx="595" cy="450" r="1.6"/><circle cx="731" cy="163" r="1.7"/><circle cx="1135" cy="270" r="1.3"/><circle cx="640" cy="302" r="1.5"/><circle cx="990" cy="40" r="1.5"/><circle cx="1040" cy="180" r="1.2"/><circle cx="900" cy="490" r="1.6"/></g>
<g class="twinkle" fill="#5ff0e0"><path d="M640 123v14m-7-7h14" stroke="#5ff0e0" stroke-width="2"/><path d="M1092 365v12m-6-6h12" stroke="#5ff0e0" stroke-width="2"/><circle cx="1015" cy="117" r="3"/></g>
<g transform="translate(58 76)">
  <rect x="0" y="0" width="8" height="34" rx="4" fill="#5ff0e0"/>
  <text x="25" y="23" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="800" letter-spacing="6" fill="#a7b0e5">BEURA LABS</text>
  <text x="0" y="120" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="67" font-weight="900" letter-spacing="-3" fill="url(#headline)">GRAVITY</text>
  <text x="0" y="193" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="67" font-weight="900" letter-spacing="-3" fill="#5ff0e0">GONE<span fill="#ffcf5c">.</span></text>
  <text x="2" y="239" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#d5dcff">The floor is no longer mandatory.</text>
  <text x="2" y="277" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#9eabd9">A momentum-driven gravity puzzle.</text>
  <g transform="translate(0 326)">
    <rect width="198" height="43" rx="21.5" fill="#5ff0e0" fill-opacity=".12" stroke="#5ff0e0" stroke-opacity=".65"/>
    <text x="99" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#5ff0e0">12 LEVELS · ONE ORBIT</text>
  </g>
</g>
<g opacity=".35" filter="url(#blur)"><ellipse cx="850" cy="432" rx="170" ry="22" fill="#5ff0e0"/></g>
<g transform="translate(855 340)">
  <circle r="145" fill="url(#planet)"/>
  <path d="M-142 -14c66-42 166-44 280-4M-136 23c66-31 167-35 270-4M-95 97c56-29 111-29 190-6" stroke="#8c85ff" stroke-opacity=".24" stroke-width="16" fill="none"/>
  <ellipse cx="0" cy="0" rx="190" ry="50" transform="rotate(-19)" fill="none" stroke="#ffcf5c" stroke-opacity=".86" stroke-width="3"/>
  <ellipse cx="0" cy="0" rx="190" ry="50" transform="rotate(-19)" fill="none" stroke="#5ff0e0" stroke-opacity=".18" stroke-width="12"/>
</g>
<g class="float" transform="translate(818 215)">
  <ellipse cx="0" cy="84" rx="58" ry="16" fill="#030513" opacity=".35" filter="url(#shadow)"/>
  <g stroke="#6679d9" stroke-width="3" stroke-linejoin="round">
    <path d="M-22 22l-36 17-9 29 17 8 29-25" fill="url(#suit)"/>
    <path d="M23 23l36 14 9 28-15 10-30-25" fill="url(#suit)"/>
    <path d="M-20 53l-13 40 22 7 19-35M16 59l20 30-17 11-19-29" fill="url(#suit)"/>
    <path d="M-22 2c0-20 12-33 25-33S27-18 27 2v35c0 17-11 30-25 30S-22 54-22 37Z" fill="url(#suit)"/>
    <path d="M-21 1c0-18 10-26 24-26S26-15 26 1v13H-21Z" fill="#27345f"/>
    <path d="M-15 0c2-8 9-12 18-12 8 0 13 4 15 12v6h-33Z" fill="#5ff0e0" stroke="#5ff0e0"/>
    <path d="M-12 4l8-2m8-1 8 3" stroke="#0b1635" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10 65v11m20-10v10" stroke="#ffcf5c" stroke-width="3"/>
  </g>
  <path d="M-13 27h26v18h-26Z" fill="#15224f" stroke="#687cdc" stroke-width="2" rx="5"/>
  <circle cx="0" cy="35" r="4" fill="#5ff0e0"/>
  <path d="M-40 72q-14 8-8 22M43 72q14 8 8 22" fill="none" stroke="#5ff0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</g>
<g class="orbit" transform="translate(850 300)">
  <circle cx="185" cy="0" r="6" fill="#5ff0e0"/>
  <circle cx="-185" cy="0" r="4" fill="#ffcf5c"/>
</g>
<text x="1140" y="504" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3" fill="#8f9ad0">BEURA LABS · PLAY YOUR OWN WAY</text>
</svg>