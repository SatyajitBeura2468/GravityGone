<style>
.tw{animation:tw 3s ease-in-out infinite}
.tw2{animation:tw 4.2s ease-in-out infinite .8s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.mine{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.4);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rot 5s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tw,.tw2,.mine,.bob,.pulse,.ring{animation:none}}
</style>
